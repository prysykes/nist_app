
services:
  db:
    image: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    env_file:
      - ./.env.prod
    ports:
      - 5434:5432

  web:
    build: .
    #command: gunicorn nist_app.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
      - ./nist_trecvid_resources/videos:/app/videos
      - ./nist_trecvid_resources/youtube_files_json:/app/youtube_files_json
      - ./nist_trecvid_resources/cluster_csv:/app/cluster_csv
      - ./nist_trecvid_resources/youtube_files_txt:/app/youtube_files_txt
    expose:
      - "8000"
    env_file:
      - .env.prod
    depends_on:
      - db
  
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./staticfiles:/app/staticfiles 
    depends_on:
      - web

volumes:
  postgres_data:

