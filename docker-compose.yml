version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: nist_postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    env_file:
      - ./.env.prod
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nist_network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nist_web
    restart: unless-stopped
    volumes:
      # Remove source code mounting in production for security
      # - .:/app  # Comment this out in production
      - media_data:/app/media
      - static_data:/app/staticfiles
      - logs_data:/app/logs
      - ./nist_trecvid_resources/videos:/app/videos:ro
      - ./nist_trecvid_resources/youtube_files_json:/app/youtube_files_json:ro
      - ./nist_trecvid_resources/cluster_csv:/app/cluster_csv:ro
      - ./nist_trecvid_resources/youtube_files_txt:/app/youtube_files_txt:ro
    expose:
      - "8000"
    env_file:
      - .env.prod
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - nist_network

  nginx:
    image: nginx:alpine
    container_name: nist_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - nist_network

volumes:
  postgres_data:
    driver: local
  media_data:
    driver: local
  static_data:
    driver: local
  logs_data:
    driver: local

networks:
  nist_network:
    driver: bridge
